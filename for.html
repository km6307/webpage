<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Teacher Feedback System</title>

    <style>
        main {
            width: 90%;
            max-width: 1050px;
            margin: 56px auto;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            box-shadow: 0 18px 45px rgba(30, 64, 175, 0.1);
            overflow: hidden;
        }

        .rating-section {
            padding: 34px 38px 22px;
        }

        .section-title {
            margin-bottom: 24px;
            color: #0f172a;
            font-size: 25px;
            font-weight: 700;
            letter-spacing: -0.4px;
        }

        .rating-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f8fafc;
            padding: 13px 16px;
            border-radius: 8px;
            margin-bottom: 10px;
            color: #475569;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .rating-row {
            display: grid;
            grid-template-columns: 1fr 300px;
            align-items: center;
            padding: 17px 15px;
            border-bottom: 1px solid #eef2f7;
        }

        .rating-row:last-child {
            border-bottom: 0;
        }

        .rating-name {
            font-size: 15px;
            font-weight: 600;
            color: #334155;
        }

        .rating {
            display: flex;
            justify-content: space-between;
        }

        .rating input {
            display: none;
        }

        .rating label {
            width: 40px;
            height: 40px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: #475569;
            transition: 0.2s ease;
        }

        .rating label:hover {
            border-color: #2563eb;
            color: #2563eb;
            background: #eff6ff;
        }

        .rating input:checked + label {
            background: #2563eb;
            color: white;
            border-color: #2563eb;
        }

        .rating input:focus-visible + label {
            outline: 3px solid rgba(37, 99, 235, 0.25);
            outline-offset: 2px;
        }

        @media (max-width: 700px) {
            main {
                width: 94%;
                margin: 25px auto;
            }

            .rating-section {
                padding: 26px 18px 16px;
            }

            .rating-row {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .rating {
                justify-content: flex-start;
                gap: 10px;
            }

        }
    </style>
</head>

<body>


<main>
        <div class="rating-section">
            <div class="section-title">
                Teaching Evaluation
            </div>
            <div class="rating-heading">
                <span>Evaluation Criteria</span>
                <span>1 = Poor &nbsp;&nbsp; 5 = Excellent</span>
            </div>
            <div class="rating-row">
                <div class="rating-name">
                    Teaching Effectiveness
                </div>
                <div class="rating">
                    <input type="radio" name="teaching" id="t1">
                    <label for="t1">1</label>
                    <input type="radio" name="teaching" id="t2">
                    <label for="t2">2</label>
                    <input type="radio" name="teaching" id="t3">
                    <label for="t3">3</label>
                    <input type="radio" name="teaching" id="t4">
                    <label for="t4">4</label>
                    <input type="radio" name="teaching" id="t5">
                    <label for="t5">5</label>
                </div>
            </div>
            <div class="rating-row">
                <div class="rating-name">
                    Communication Skills
                </div>
                <div class="rating">
                    <input type="radio" name="communication" id="c1">
                    <label for="c1">1</label>
                    <input type="radio" name="communication" id="c2">
                    <label for="c2">2</label>
                    <input type="radio" name="communication" id="c3">
                    <label for="c3">3</label>
                    <input type="radio" name="communication" id="c4">
                    <label for="c4">4</label>
                    <input type="radio" name="communication" id="c5">
                    <label for="c5">5</label>
                </div>
            </div>
            <div class="rating-row">
                <div class="rating-name">
                    Classroom Support
                </div>
                <div class="rating">
                    <input type="radio" name="support" id="s1">
                    <label for="s1">1</label>
                    <input type="radio" name="support" id="s2">
                    <label for="s2">2</label>
                    <input type="radio" name="support" id="s3">
                    <label for="s3">3</label>
                    <input type="radio" name="support" id="s4">
                    <label for="s4">4</label>
                    <input type="radio" name="support" id="s5">
                    <label for="s5">5</label>
                </div>
            </div>
            <div class="rating-row">
                <div class="rating-name">
                    Professional Growth
                </div>
                <div class="rating">
                    <input type="radio" name="growth" id="g1">
                    <label for="g1">1</label>
                    <input type="radio" name="growth" id="g2">
                    <label for="g2">2</label>
                    <input type="radio" name="growth" id="g3">
                    <label for="g3">3</label>
                    <input type="radio" name="growth" id="g4">
                    <label for="g4">4</label>
                    <input type="radio" name="growth" id="g5">
                    <label for="g5">5</label>
                </div>
            </div>
</main>

</body>
</html>
