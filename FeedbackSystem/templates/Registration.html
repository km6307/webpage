<!doctype html>
<html>
    <head>
        <title>Registration Page</title>
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <style>
        * { box-sizing: border-box; }
        body {
          margin: 0;
          min-height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 30px 15px;
          font-family: Arial, sans-serif;
          background: linear-gradient(135deg, #e8f5e9, #b2dfdb);
          color: #263238;
        }
        .container { width: 100%; max-width: 560px; }
        .row, .col-md-12 { width: 100%; }
        .card {
          overflow: hidden;
          border-radius: 16px;
          background: #fff;
          box-shadow: 0 12px 35px rgba(0, 77, 64, .18);
        }
        .card-header {
          padding: 16px;
          text-align: center;
          background: linear-gradient(135deg, #2e7d32, #43a047);
          color: #fff;
        }
        h1 { margin: 0; font-size: 28px; }
        .card-body { padding: 18px 32px; }
        .form-group { margin-bottom: 12px; }
        label {
          display: block;
          margin-bottom: 7px;
          font-weight: 600;
          color: #37474f;
        }
        input:not([type="submit"]) {
          width: 100%;
          padding: 12px 14px;
          border: 1px solid #cfd8dc;
          border-radius: 8px;
          font-size: 15px;
          transition: border-color .2s, box-shadow .2s;
        }
        input:not([type="submit"]):focus {
          outline: none;
          border-color: #43a047;
          box-shadow: 0 0 0 3px rgba(67, 160, 71, .15);
        }
        input[type="submit"] {
          width: 100%;
          padding: 13px;
          border: 0;
          border-radius: 8px;
          background: #2e7d32;
          color: #fff;
          font-size: 16px;
          font-weight: 700;
          cursor: pointer;
          transition: background .2s, transform .2s;
        }
        input[type="submit"]:hover { background: #1b5e20; transform: translateY(-1px); }
        .alert {
          margin-bottom: 16px;
          padding: 12px 15px;
          border-radius: 8px;
          background: #ffebee;
          color: #c62828;
          border: 1px solid #ffcdd2;
        }
        .card-footer { height: 6px; background: #2e7d32; }
        @media (max-width: 480px) {
          .card-body { padding: 22px 18px; }
          h1 { font-size: 24px; }
        }
      </style>
    </head>
 <body>
 <div class="container">
  <div class="row">
    <div class="col-md-12 mt-2">
        {% for msg in messages %}
       <div class="alert alert-danger" role="alert">
                  {{ msg }}
             </div>
        {% endfor %}
      <div class="card">
  <div class="card-header text-center bg-success">
    <h1>Registration Page</h1>
  </div>
  <div class="card-body">
    <form action="registration" method="post">
        {% csrf_token %}
<div class="form-group">
  <label for="first_name"> Name</label>
   <input type="text" class="form-control" name="first_name" id="first_name" placeholder="Enter Your Name" required>
</div>

 <div class="form-group">
 <label for="username"> UserName </label>
 <input type="text" class="form-control" name="username" id="username" placeholder="Enter username Name" required>
 </div>

 <div class="form-group">
 <label for="email">Enter Email </label>
 <input type="email" class="form-control" name="email" id="email" placeholder="Enter email Name" required>
 </div>

                    <div class="form-group">
                    <label for="password"> Password </label>
                        <input type="password" class="form-control" name="password" id="password" placeholder="Enter password" required>
                    </div>

                     <div class="form-group">
                    <label for="cpassword">CPassword </label>
                        <input type="password" class="form-control" name="cpassword" id="cpassword" placeholder="Enter password again" required>
                    </div>

                    <div class="form-group">
                        <input type="submit"  class="btn btn-success" value="Register">
                    </div>
    </form>
  </div>
  <div class="card-footer"></div>
</div>
    </div>
  </div>
</div>
 </body>
</html>
