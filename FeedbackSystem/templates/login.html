<!doctype html>
<html>
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <style>
      * { 
        box-sizing: border-box;
       }
      body {
        --root-font-size: 16px;
        --root-bg-color: #191a1b;
        --root-panel-bg-color: #ffffff;
        --root-text-color: #1d2b45;
        min-height: 100vh;
        margin: 0;
        padding: 32px 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        background: radial-gradient(circle at 15% 10%, #525861 0, transparent 36%),
              linear-gradient(135deg, #09090a, var(--root-bg-color));
        color: var(--root-text-color);
      }
      .container { width: 100%; max-width: 410px; }
      .row, .col-md-12 { width: 100%; }
      .card {
        overflow: hidden;
        border: 1px solid #d8e2f2;
        border-radius: 18px;
        background: var(--root-panel-bg-color);
        box-shadow: 0 22px 60px rgba(37, 61, 105, .14);
      }
      .card-header {
        padding: 28px 30px 24px;
        color: #e9eef2;
        background: linear-gradient(145deg, #3f4d63, #595f69);
        border-bottom: 1px solid #d4e1f4;
      }
      .card-header h1 { margin: 0 0 7px; font-size: 25px; letter-spacing: -.5px; }
      .card-header p { margin: 0; color: #cbd1cd; font-size: 14px; line-height: 1.5; }
      .card-body { padding: 26px 30px 22px; }
      .form-group { margin-bottom: 18px; }
      label { display: block; margin-bottom: 8px; color: #30443a; font-size: 14px; font-weight: 650; }
      input[type="text"], input[type="password"] {
        width: 100%;
        min-height: 46px;
        padding: 10px 13px;
        border: 1px solid #d2ddd5;
        border-radius: 9px;
        color: #17231c;
        background: #aba3a3;
        font-family: inherit;
        font-size: 15px;
        transition: border-color .2s, box-shadow .2s, background .2s;
      }
      input::placeholder { color: #97a69c; }
      #role {
        display: block;
        width: 100%;
        margin-bottom: 16px;
        min-height: 46px;
        padding: 10px 13px;
        border: 1px solid #d2ddd5;
        border-radius: 9px;
        color: #17231c;
        background: #878181;
        font: inherit;
        font-size: 15px;
        cursor: pointer;
        transition: border-color .2s, box-shadow .2s;
      }
      #role:focus {
        outline: none;
        border-color: #198754;
        background: #e7dada;
        box-shadow: 0 0 0 4px rgba(25, 135, 84, .12);
      }
      input:focus {
        outline: none;
        border-color: #198754;
        background: #fff;
        box-shadow: 0 0 0 4px rgba(25, 135, 84, .12);
      }
      .password-wrapper { position: relative; }
      .password-wrapper input { padding-right: 48px; }
      .password-wrapper input::-ms-reveal { display: none; }
      .toggle-password {
        position: absolute;
        top: 50%;
        right: 15px;
        border: 0;
        padding: 0;
        color: #557261;
        background: transparent;
        font-size: 18px;
        cursor: pointer;
        transform: translateY(-50%);
      }
      .toggle-password:focus { outline: 2px solid #198754; outline-offset: 2px; }
      .btn {
        width: 100%;
        min-height: 48px;
        padding: 13px 16px;
        border: 0;
        border-radius: 8px;
        color: #fff;
        background: #3568c8;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 6px 16px rgba(53, 104, 200, .22);
        transition: background .2s, transform .2s, box-shadow .2s;
      }
      .btn:hover {
           background: #2855a8; 
           transform: translateY(-1px);
            box-shadow: 0 7px 16px rgba(53, 104, 200, .28); 
        }
      .card-footer {
        padding: 14px 20px;
        color: #eef4f0;
        background: #051a10;
        border-top: 1px solid #edf1ee;
         text-align: center;
        font-size: 13px;
        }
      .alert { 
        color: #dc3545; 
        transition: opacity .3s ease;
        padding-bottom: 12px;
        font-size: 14px;
       }
      .alert.alert-danger { 
        color: #dc3545; 
      }
      .alert.hide { 
        opacity: 0; 
      }
      @media (max-width: 480px) {
        body { padding: 20px 16px; }
        .card-header, .card-body { padding-left: 22px; padding-right: 22px; }
      }
    </style>
    </head>
 <body>
 <div class="container">
  <div class="row">
    <div class="col-md-12 mt-2">
         
      <div class="card">
  <div class="card-header">
    <h1>Login Page</h1>
    <p>Sign in to continue to the feedback system</p>
  </div>
  <div class="card-body">
    <form action="login" method="post">
        {% csrf_token %}

        <div>
            <label for="role">Role <span style="color:red">*</span></label>
            <select name="role" id="role" required>
                <option value="">Select your role</option>
                <option value="admin">Admin</option>
                <option value="user">Student</option>
            </select>
        </div>
        <div class="form-group">
           <label for="username"> Id <span style="color:red">*</span></label>
           <input type="text" name="username" id="username"placeholder="Enter your Username" required>
        </div>
        <div class="form-group">
            <label for="password"> Password <span style="color:red">*</span> </label>
            <div class="password-wrapper">
              <input type="password" name="password" id="password" placeholder="Enter password" required>
              <button type="button" class="toggle-password" id="togglePassword" aria-label="Show password" aria-pressed="false">&#128065;</button>
            </div>
        </div>
         {% for msg in messages %}
       <div class="alert alert-danger" role="alert">
                  {{ msg }}
             </div>
        {% endfor %}
 
        <div class="form-group">
            <input type="submit" class="btn" value="Login">
        </div>
    </form>
  </div>
  <div class="card-footer">Secure access to your feedback dashboard</div>
</div>
    </div>
  </div>
</div>

 </body>
 <script>
   const password = document.getElementById('password');
   const togglePassword = document.getElementById('togglePassword');
   togglePassword.addEventListener('click', function () {
     const isHidden = password.type === 'password';
     password.type = isHidden ? 'text' : 'password';
     this.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
     this.setAttribute('aria-pressed', isHidden);
   });

   document.querySelectorAll('.alert').forEach(function (alert) {
     setTimeout(function () {
       alert.classList.add('hide');
       setTimeout(function () { alert.remove(); }, 300);
     }, 3000);
   });
 </script>
</html>
