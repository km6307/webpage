<!doctype html>
<html>
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #e8f5e9, #b9e4c9);
        color: #24332a;
      }
      .container { width: 100%; max-width: 430px; }
      .card {
        overflow: hidden;
        border-radius: 18px;
        background: #fff;
        box-shadow: 0 18px 45px rgba(33, 83, 52, .2);
      }
      .card-header {
        padding: 30px 24px;
        text-align: center;
        color: #fff;
        background: linear-gradient(135deg, #198754, #31b36b);
      }
      .card-header h1 { margin: 0; font-size: 30px; }
      .card-body { padding: 30px; }
      .form-group { margin-bottom: 20px; }
      label { display: block; margin-bottom: 8px; font-weight: 600; }
      input[type="text"], input[type="password"] {
        width: 100%;
        padding: 13px 15px;
        border: 1px solid #cbd8ce;
        border-radius: 9px;
        font-size: 15px;
        transition: border-color .2s, box-shadow .2s;
      }
      input:focus {
        outline: none;
        border-color: #198754;
        box-shadow: 0 0 0 3px rgba(25, 135, 84, .15);
      }
      .btn {
        width: 100%;
        padding: 13px;
        border: 0;
        border-radius: 9px;
        color: #fff;
        background: #198754;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        transition: background .2s, transform .2s;
      }
      .btn:hover { background: #146c43; transform: translateY(-1px); }
      .card-footer { height: 6px; background: #e9f7ee; }
    </style>
    </head>
 <body>
 <div class="container">
  <div class="row">
    <div class="col-md-12 mt-2">
 
      <div class="card">
  <div class="card-header text-center bg-success">
    <h1>Login Page</h1>
  </div>
  <div class="card-body">
    <form action="360°Feedback" method="post">
        {% csrf_token %}


        <div class="form-group">
           <label for="username"> UserName </label>
           <input type="text" class="form-control" name="username" id="username" placeholder="Enter username Name" required>
        </div>
        <div class="form-group">
            <label for="password"> Password </label>
            <input type="password" class="form-control" name="password" id="password" placeholder="Enter password" required>
        </div>
        <div class="form-group">
            <input type="submit"  class="btn btn-success" value="Login">
        </div>
    </form>
  </div>
  <div class="card-footer"></div>
</div>
    </div>
  </div>
</div>

 </body>
</html>
