<!doctype html>
<html>
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 20px;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        background: #f4f7f5;
        color: #17231c;
      }
      .container { width: 100%; max-width: 400px; }
      .card {
        overflow: hidden;
        border: 1px solid #e2e9e4;
        border-radius: 16px;
        background: #fff;
        box-shadow: 0 20px 55px rgba(25, 55, 37, .11);
      }
      .card-header {
        padding: 34px 36px 30px;
        color: #173b28;
        background: #edf7f0;
        border-bottom: 1px solid #dcebe0;
      }
      .card-header h1 { margin: 0 0 8px; font-size: 27px; letter-spacing: -.4px; }
      .card-header p { margin: 0; color: #557261; font-size: 14px; }
      .card-body { padding: 34px 36px 30px; }
      .form-group { margin-bottom: 22px; }
      label { display: block; margin-bottom: 9px; color: #30443a; font-size: 14px; font-weight: 700; }
      input[type="text"], input[type="password"] {
        width: 100%;
        padding: 14px 15px;
        border: 1px solid #d2ddd5;
        border-radius: 8px;
        color: #17231c;
        background: #fbfdfb;
        font-size: 15px;
        transition: border-color .2s, box-shadow .2s;
      }
      input:focus {
        outline: none;
        border-color: #198754;
        background: #fff;
        box-shadow: 0 0 0 4px rgba(25, 135, 84, .12);
      }
      .btn {
        width: 100%;
        padding: 14px;
        border: 0;
        border-radius: 8px;
        color: #fff;
        background: #198754;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 5px 12px rgba(25, 135, 84, .18);
        transition: background .2s, transform .2s, box-shadow .2s;
      }
      .btn:hover { background: #146c43; transform: translateY(-1px); box-shadow: 0 7px 16px rgba(25, 135, 84, .25); }
      .card-footer { padding: 16px; color: #789083; background: #fafcfb; text-align: center; font-size: 12px; }
      @media (max-width: 480px) { .card-header, .card-body { padding-left: 24px; padding-right: 24px; } }
    </style>
    </head>
 <body>
 <div class="container">
  <div class="row">
    <div class="col-md-12 mt-2">
 
      <div class="card">
  <div class="card-header">
    <h1>Login Page</h1>
    <p>Sign in to continue to the feedback system</p>
  </div>
  <div class="card-body">
    <form action="home" method="post">
        {% csrf_token %}


        <div class="form-group">
           <label for="studutentId">Id <span style="color:red">*</span> </label>
           <input type="text" name="studutentId" id="studutentId" placeholder="Enter your id" required>
        </div>
        <div class="form-group">
            <label for="password"> Password <span style="color:red">*</span> </label>
            <input type="password" name="password" id="password" placeholder="Enter password" required>
        </div>
        <div class="form-group">
            <input type="submit" class="btn" value="Login">
        </div>
    </form>
  </div>
  <div class="card-footer">Secure access to your feedback dashboard</div>
</div>
    </div>
  </div>
</div>

 </body>
</html>
